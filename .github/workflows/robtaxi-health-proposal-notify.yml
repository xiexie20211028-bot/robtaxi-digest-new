name: Robtaxi Health Proposal Notification

on:
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  notify_proposal_ready:
    if: ${{ github.event.label.name == 'proposal-ready' && startsWith(github.event.issue.title, '[Robtaxi Health]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Notify Feishu
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_OPEN_ID: ${{ secrets.FEISHU_RECEIVE_OPEN_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          TEXT=$'Robtaxi 修复方案待审批\n'"${ISSUE_TITLE}"$'\n'"${ISSUE_URL}"$'\n请在对应 Codex 任务中输入：批准 proposal_id'
          python -m app.notify_feishu --date "$(TZ=Asia/Shanghai date +%Y-%m-%d)" --text "$TEXT" --report ./artifacts/proposal-notify

      - name: Notify WeCom
        continue-on-error: true
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          TEXT=$'Robtaxi 修复方案待审批\n'"${ISSUE_TITLE}"$'\n'"${ISSUE_URL}"$'\n请在对应 Codex 任务中输入：批准 proposal_id'
          python -m app.notify_wecom --date "$(TZ=Asia/Shanghai date +%Y-%m-%d)" --text "$TEXT" --report ./artifacts/proposal-notify
