name: Domestic Robotaxi L3-L4 Industry Agent

on:
  schedule:
    # 每日北京时间 08:00；必须在 08:45 前结束。
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: "robtaxi-domestic-industry-agent"
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve run date
        id: run_date
        run: echo "date_bj=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m app.validate_sources ./sources.json

      - name: Restore isolated Agent state
        id: agent_state
        uses: actions/cache/restore@v4
        with:
          path: .state-agent
          key: robtaxi-agent-state-${{ steps.run_date.outputs.date_bj }}
          restore-keys: |
            robtaxi-agent-state-

      - name: Run independent industry research Agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          DATE_BJ="${{ steps.run_date.outputs.date_bj }}"
          python -m app.industry_agent.runner \
            --date "$DATE_BJ" \
            --config ./sources.json \
            --out ./artifacts-agent \
            --state ./.state-agent

      - name: Save isolated Agent state
        if: ${{ always() && steps.agent_state.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .state-agent
          key: robtaxi-agent-state-${{ steps.run_date.outputs.date_bj }}

      - name: Save same-day production handoff
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: artifacts-agent
          key: robtaxi-agent-handoff-${{ steps.run_date.outputs.date_bj }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload 35-day Agent evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: robtaxi-agent-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 35
          if-no-files-found: error
          path: artifacts-agent
