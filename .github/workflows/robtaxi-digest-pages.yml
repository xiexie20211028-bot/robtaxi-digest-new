name: Robtaxi Digest Pages

on:
  schedule:
    # 每日 09:00（北京时间）执行，UTC 对应 01:00。
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      send_notify:
        description: "手动运行是否推送通知（飞书+企微，默认否）"
        required: false
        type: boolean
        default: false
      self_check_fixture:
        description: "自检验收事件；正式运行保持 none"
        required: false
        type: choice
        default: none
        options:
          - none
          - warning
          - error
          - critical

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "robtaxi-digest-pages"
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-latest
    outputs:
      date_bj: ${{ steps.context.outputs.date_bj }}
      profile: ${{ steps.context.outputs.profile }}
    steps:
      - id: context
        env:
          PROFILE: ${{ vars.ROBTAXI_ACTIVE_PROFILE || 'hybrid_domestic' }}
        run: |
          echo "date_bj=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

  agent:
    needs: context
    if: ${{ needs.context.outputs.profile == 'hybrid_domestic' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .state-agent
          key: robtaxi-agent-production-v2-${{ needs.context.outputs.date_bj }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: robtaxi-agent-production-v2-
      - name: Run production Agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m app.industry_agent.runner --date '${{ needs.context.outputs.date_bj }}' --config sources.json --out artifacts-agent --state .state-agent
      - name: Bind handoff to this production run
        if: ${{ always() }}
        run: python -m app.industry_agent.handoff --date '${{ needs.context.outputs.date_bj }}'
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: robtaxi-agent-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts-agent
          retention-days: 35
          if-no-files-found: warn
      - uses: actions/cache/save@v4
        if: ${{ always() }}
        with:
          path: .state-agent
          key: robtaxi-agent-production-v2-${{ needs.context.outputs.date_bj }}-${{ github.run_id }}-${{ github.run_attempt }}

  legacy:
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .state/source_health_history.json
          key: robtaxi-legacy-health-${{ needs.context.outputs.date_bj }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: robtaxi-legacy-health-
      - name: Collect complete legacy source set
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python -m app.fetch --profile legacy --date '${{ needs.context.outputs.date_bj }}' --sources sources.json --out artifacts/raw --report artifacts/reports
      - name: Bind legacy collection to this run
        if: ${{ always() }}
        run: python -m app.industry_agent.handoff --route legacy --root artifacts --date '${{ needs.context.outputs.date_bj }}'
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: robtaxi-legacy-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          retention-days: 35
          if-no-files-found: warn
      - uses: actions/cache/save@v4
        if: ${{ always() }}
        with:
          path: .state/source_health_history.json
          key: robtaxi-legacy-health-${{ needs.context.outputs.date_bj }}-${{ github.run_id }}-${{ github.run_attempt }}
  build:
    needs: [context, agent, legacy]
    if: ${{ always() && needs.context.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      ROBTAXI_PROFILE: ${{ needs.context.outputs.profile }}
    outputs:
      date_bj: ${{ steps.run_date.outputs.date_bj }}
      test_status: ${{ steps.tests.outcome }}
      available: ${{ steps.routes.outputs.available }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve run date
        id: run_date
        run: |
          DATE_BJ="${{ needs.context.outputs.date_bj }}"
          mkdir -p artifacts
          echo "$DATE_BJ" > artifacts/run_date.txt
          echo "date_bj=$DATE_BJ" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate sources config
        run: |
          python -m app.validate_sources ./sources.json

      - name: Run tests
        id: tests
        run: |
          pip install -r requirements-dev.txt
          PYTHONPATH=. python -m pytest -q

      - name: Restore 35-day pipeline state
        id: pipeline_state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: robtaxi-pipeline-state-${{ steps.run_date.outputs.date_bj }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            robtaxi-pipeline-state-

      - name: Download this run legacy collection
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: robtaxi-legacy-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
      - name: Download this run Agent evidence
        if: ${{ needs.context.outputs.profile == 'hybrid_domestic' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: robtaxi-agent-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts-agent
      - name: Prepare usable production routes
        id: routes
        run: python -m app.industry_agent.production --date '${{ needs.context.outputs.date_bj }}' --legacy-status '${{ needs.legacy.result }}' --profile "$ROBTAXI_PROFILE"

      - name: Run pipeline stages
        if: ${{ steps.routes.outputs.available == 'true' }}
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          DATE_BJ="${{ steps.run_date.outputs.date_bj }}"
          PROFILE="$ROBTAXI_PROFILE"
          python -m app.parse --date "$DATE_BJ" --in ./artifacts/raw --out ./artifacts/canonical --report ./artifacts/reports
          python -m app.filter_relevance --profile "$PROFILE" --date "$DATE_BJ" --in ./artifacts/canonical --out ./artifacts/filtered --sources ./sources.json --report ./artifacts/reports
          python -m app.enrich --date "$DATE_BJ" --in ./artifacts/filtered --out ./artifacts/enriched --report ./artifacts/reports
          python -m app.summarize --profile "$PROFILE" --date "$DATE_BJ" --in ./artifacts/enriched --out ./artifacts/brief --provider deepseek --report ./artifacts/reports --sources ./sources.json
          python -m app.editorial_digest --profile "$PROFILE" --date "$DATE_BJ" --in ./artifacts/brief --out ./artifacts/digest --provider deepseek --report ./artifacts/reports --sources ./sources.json
          python -m app.render --profile "$PROFILE" --date "$DATE_BJ" --in ./artifacts/brief --out ./site/index.html --report ./artifacts/reports --sources ./sources.json

      - name: Save 35-day pipeline state
        if: ${{ steps.routes.outputs.available == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .state
          key: robtaxi-pipeline-state-${{ steps.run_date.outputs.date_bj }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore last published page on complete route failure
        if: ${{ steps.routes.outputs.available != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: site
          key: robtaxi-published-page-${{ github.run_id }}
          restore-keys: robtaxi-published-page-
      - name: Resolve previous publication URL
        id: pages
        if: ${{ steps.routes.outputs.available != 'true' }}
        uses: actions/configure-pages@v5
      - name: Show failed update without relabeling previous news
        if: ${{ steps.routes.outputs.available != 'true' }}
        env:
          PREVIOUS_URL: ${{ steps.pages.outputs.base_url }}
        run: python -m app.industry_agent.publication --previous-url "$PREVIOUS_URL"

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Upload base run artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: robtaxi-base-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 35
          path: |
            artifacts
            artifacts-agent
            site/index.html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.result == 'success' }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Download successfully published site
        if: ${{ needs.build.outputs.available == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: robtaxi-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Save last successful publication
        if: ${{ needs.build.outputs.available == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: site
          key: robtaxi-published-page-${{ github.run_id }}-${{ github.run_attempt }}

  notify:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: ${{ needs.build.result == 'success' && needs.deploy.result == 'success' && needs.build.outputs.available == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.send_notify == 'true')) }}
    outputs:
      notify_status: ${{ steps.notify_result.outputs.notify_status }}
      feishu_status: ${{ steps.notify_result.outputs.feishu_status }}
      wecom_status: ${{ steps.notify_result.outputs.wecom_status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download base run artifacts
        uses: actions/download-artifact@v4
        with:
          name: robtaxi-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Resolve run date
        id: run_date
        run: |
          if [[ -f artifacts/run_date.txt ]]; then
            DATE_BJ="$(cat artifacts/run_date.txt)"
          else
            DATE_BJ="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          fi
          echo "date_bj=$DATE_BJ" >> "$GITHUB_OUTPUT"

      - name: Check durable daily notification locks
        id: notify_locks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m app.notification_lock \
            --date "${{ steps.run_date.outputs.date_bj }}" \
            --repository "${GITHUB_REPOSITORY}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Push digest to Feishu
        id: push_feishu
        if: ${{ steps.notify_locks.outputs.feishu_locked != 'true' }}
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_OPEN_ID: ${{ secrets.FEISHU_RECEIVE_OPEN_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: |
          DATE_BJ="${{ steps.run_date.outputs.date_bj }}"
          python -m app.notify_feishu --date "$DATE_BJ" --html-url "${{ needs.deploy.outputs.page_url }}" --in ./artifacts/brief --digest-root ./artifacts/digest --report ./artifacts/reports

      - name: Write Feishu durable lock marker
        if: ${{ steps.notify_locks.outputs.feishu_locked != 'true' && steps.push_feishu.outputs.sent == 'true' }}
        run: |
          mkdir -p .notify-lock
          echo "${GITHUB_RUN_ID}" > .notify-lock/${{ steps.run_date.outputs.date_bj }}.feishu.sent

      - name: Upload Feishu durable daily lock
        if: ${{ steps.notify_locks.outputs.feishu_locked != 'true' && steps.push_feishu.outputs.sent == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: robtaxi-notify-lock-${{ steps.run_date.outputs.date_bj }}-feishu
          path: .notify-lock/${{ steps.run_date.outputs.date_bj }}.feishu.sent
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 35

      - name: Push digest to WeCom
        id: push_wecom
        if: ${{ steps.notify_locks.outputs.wecom_locked != 'true' }}
        continue-on-error: true
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: |
          DATE_BJ="${{ steps.run_date.outputs.date_bj }}"
          python -m app.notify_wecom --date "$DATE_BJ" --html-url "${{ needs.deploy.outputs.page_url }}" --in ./artifacts/brief --digest-root ./artifacts/digest --report ./artifacts/reports

      - name: Write WeCom durable lock marker
        if: ${{ steps.notify_locks.outputs.wecom_locked != 'true' && steps.push_wecom.outputs.sent == 'true' }}
        run: |
          mkdir -p .notify-lock
          echo "${GITHUB_RUN_ID}" > .notify-lock/${{ steps.run_date.outputs.date_bj }}.wecom.sent

      - name: Upload WeCom durable daily lock
        if: ${{ steps.notify_locks.outputs.wecom_locked != 'true' && steps.push_wecom.outputs.sent == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: robtaxi-notify-lock-${{ steps.run_date.outputs.date_bj }}-wecom
          path: .notify-lock/${{ steps.run_date.outputs.date_bj }}.wecom.sent
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 35

      - name: Aggregate notification results
        id: notify_result
        if: ${{ always() }}
        env:
          FEISHU_LOCKED: ${{ steps.notify_locks.outputs.feishu_locked }}
          FEISHU_OUTCOME: ${{ steps.push_feishu.outcome }}
          FEISHU_SENT: ${{ steps.push_feishu.outputs.sent }}
          WECOM_LOCKED: ${{ steps.notify_locks.outputs.wecom_locked }}
          WECOM_OUTCOME: ${{ steps.push_wecom.outcome }}
          WECOM_SENT: ${{ steps.push_wecom.outputs.sent }}
        run: |
          FEISHU_STATUS="reported"
          WECOM_STATUS="reported"
          if [[ "$FEISHU_LOCKED" == "true" ]]; then
            FEISHU_STATUS="already_sent"
          elif [[ "$FEISHU_OUTCOME" == "failure" || "$FEISHU_SENT" != "true" ]]; then
            FEISHU_STATUS="failed"
          fi
          if [[ "$WECOM_LOCKED" == "true" ]]; then
            WECOM_STATUS="already_sent"
          elif [[ "$WECOM_OUTCOME" == "failure" || "$WECOM_SENT" != "true" ]]; then
            WECOM_STATUS="failed"
          fi
          python -m app.finalize_notify \
            --date "${{ steps.run_date.outputs.date_bj }}" \
            --report ./artifacts/reports \
            --feishu-status "$FEISHU_STATUS" \
            --wecom-status "$WECOM_STATUS" \
            --expected \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload final notification report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: robtaxi-notify-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 35
          path: |
            artifacts/reports
            artifacts/run_date.txt

      - name: Fail when a required notification channel failed
        if: ${{ always() && steps.notify_result.outputs.notify_status != 'success' }}
        run: exit 1

  self_check:
    runs-on: ubuntu-latest
    needs: [build, deploy, notify]
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
      issues: write
    outputs:
      overall_status: ${{ steps.run_self_check.outputs.overall_status }}
      request_id: ${{ steps.run_self_check.outputs.request_id }}
      issue_url: ${{ steps.health_issue.outputs.issue_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download base run artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: robtaxi-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Download final notification report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: robtaxi-notify-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./artifacts

      - name: Resolve self-check date
        id: run_date
        env:
          BUILD_DATE: ${{ needs.build.outputs.date_bj }}
        run: |
          DATE_BJ="$BUILD_DATE"
          if [[ -z "$DATE_BJ" && -f artifacts/run_date.txt ]]; then
            DATE_BJ="$(cat artifacts/run_date.txt)"
          fi
          if [[ -z "$DATE_BJ" ]]; then
            DATE_BJ="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          fi
          echo "date_bj=$DATE_BJ" >> "$GITHUB_OUTPUT"

      - name: Run final self-check
        id: run_self_check
        continue-on-error: true
        env:
          BUILD_STATUS: ${{ needs.build.result }}
          TEST_STATUS: ${{ needs.build.outputs.test_status }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          NOTIFY_JOB_STATUS: ${{ needs.notify.result }}
          FEISHU_STATUS: ${{ needs.notify.outputs.feishu_status }}
          WECOM_STATUS: ${{ needs.notify.outputs.wecom_status }}
          NOTIFY_EXPECTED: ${{ needs.build.outputs.available == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.send_notify == 'true')) }}
          FIXTURE_SEVERITY: ${{ github.event.inputs.self_check_fixture || 'none' }}
        run: |
          NOTIFY_ARGS=()
          if [[ "$NOTIFY_EXPECTED" == "true" ]]; then
            NOTIFY_ARGS+=(--notify-expected)
          fi
          python -m app.self_check \
            --date "${{ steps.run_date.outputs.date_bj }}" \
            --workspace . \
            --sources ./sources.json \
            --out ./artifacts/health \
            --build-status "$BUILD_STATUS" \
            --test-status "${TEST_STATUS:-unknown}" \
            --deploy-status "$DEPLOY_STATUS" \
            --notify-job-status "$NOTIFY_JOB_STATUS" \
            --feishu-status "${FEISHU_STATUS:-skipped}" \
            --wecom-status "${WECOM_STATUS:-skipped}" \
            --github-run-id "${GITHUB_RUN_ID}" \
            --github-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --commit-sha "${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --event-name "${GITHUB_EVENT_NAME}" \
            --fixture-severity "$FIXTURE_SEVERITY" \
            --github-output "$GITHUB_OUTPUT" \
            "${NOTIFY_ARGS[@]}"

      - name: Synchronize GitHub health Issue
        id: health_issue
        if: ${{ always() && steps.run_self_check.outputs.health_dir != '' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEALTH_DIR: ${{ steps.run_self_check.outputs.health_dir }}
          HEALTH_ARTIFACT: robtaxi-health-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python -m app.health_issue \
            --health-report "$HEALTH_DIR/health_report.json" \
            --repair-request "$HEALTH_DIR/repair_request.json" \
            --artifact-name "$HEALTH_ARTIFACT" \
            --repository "${GITHUB_REPOSITORY}" \
            --out "$HEALTH_DIR/issue_sync.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Send health alert to Feishu
        if: ${{ steps.health_issue.outputs.should_alert == 'true' }}
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_OPEN_ID: ${{ secrets.FEISHU_RECEIVE_OPEN_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          ALERT_FILE: ${{ steps.health_issue.outputs.alert_file }}
        run: |
          TEXT="$(cat "$ALERT_FILE")"
          python -m app.notify_feishu --date "${{ steps.run_date.outputs.date_bj }}" --text "$TEXT" --report ./artifacts/health-notify-reports

      - name: Send health alert to WeCom
        if: ${{ steps.health_issue.outputs.should_alert == 'true' }}
        continue-on-error: true
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          ALERT_FILE: ${{ steps.health_issue.outputs.alert_file }}
        run: |
          TEXT="$(cat "$ALERT_FILE")"
          python -m app.notify_wecom --date "${{ steps.run_date.outputs.date_bj }}" --text "$TEXT" --report ./artifacts/health-notify-reports

      - name: Upload final health artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: robtaxi-health-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/health
            artifacts/health-notify-reports

      - name: Conclude health gate
        if: ${{ always() }}
        env:
          SELF_CHECK_OUTCOME: ${{ steps.run_self_check.outcome }}
          ISSUE_OUTCOME: ${{ steps.health_issue.outcome }}
          OVERALL_STATUS: ${{ steps.run_self_check.outputs.overall_status }}
        run: |
          if [[ "$SELF_CHECK_OUTCOME" != "success" || "$ISSUE_OUTCOME" == "failure" ]]; then
            exit 1
          fi
          if [[ "$OVERALL_STATUS" == "error" || "$OVERALL_STATUS" == "critical" ]]; then
            exit 1
          fi
