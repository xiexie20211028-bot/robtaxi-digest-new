name: Robtaxi Project Governance

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      issue:
        description: 要进行 postflight 校验的 Issue 编号
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  project-task-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted governance rules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0

      - name: Fetch candidate object without executing candidate rules
        if: ${{ github.event_name == 'pull_request' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Project task governance
        env:
          ROBTAXI_PROJECT_READ_TOKEN: ${{ secrets.ROBTAXI_PROJECT_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.ROBTAXI_PROJECT_READ_TOKEN }}
        run: |
          # 首个治理 PR 的受信任 base 尚未包含校验器；合并后必须手动执行一次 postflight 验证。
          if [[ "${{ github.event_name }}" == "pull_request" && ! -f scripts/validate_project_task.py ]]; then
            echo "Bootstrap PR: trusted base has no governance validator yet."
            exit 0
          fi
          if [[ -z "$ROBTAXI_PROJECT_READ_TOKEN" ]]; then
            echo "ROBTAXI_PROJECT_READ_TOKEN is required; this gate fails closed."
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3 scripts/validate_project_task.py --phase pr --event "$GITHUB_EVENT_PATH" --json
          else
            python3 scripts/validate_project_task.py --phase postflight --issue "${{ inputs.issue }}" --json
          fi

      - name: Verify trusted autonomy contract and scope
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.ROBTAXI_PROJECT_READ_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTOMATED: ${{ startsWith(github.head_ref, 'workbuddy/development-') || contains(github.event.pull_request.labels.*.name, 'workbuddy-development') }}
        run: |
          if [[ -f scripts/validate_development_delivery.py ]]; then
            python3 scripts/validate_development_delivery.py --event "$GITHUB_EVENT_PATH" --base "$BASE_SHA" --head "$HEAD_SHA"
          elif [[ "$AUTOMATED" == "true" ]]; then
            echo "Trusted automation validator is not installed."
            exit 1
          fi

      - name: Replay fixed business evidence with trusted baseline
        if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'workbuddy/development-') || contains(github.event.pull_request.labels.*.name, 'workbuddy-development')) }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -m pip install -r requirements.txt -r requirements-dev.txt
          python3 scripts/development_replay.py --base "$BASE_SHA" --head "$HEAD_SHA" --out artifacts/development-replay.json

      - name: Upload independent business replay
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: development-replay-${{ github.run_id }}
          path: artifacts/development-replay.json
          if-no-files-found: ignore
          retention-days: 35

      - name: Verify WorkBuddy trusted semantic diff
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'workbuddy/health-') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ ! -f scripts/validate_health_autofix.py ]]; then
            echo "Trusted base does not contain the WorkBuddy autofix validator."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          python3 scripts/validate_health_autofix.py \
            --event "$GITHUB_EVENT_PATH" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --config .github/robtaxi-health-autofix.json \
            --json
