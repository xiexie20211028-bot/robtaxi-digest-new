name: 研发工作项
description: 登记个人用户需要的 Bug、需求、优化、技术债或监控任务
title: "[待办] "
labels: []
body:
  - type: dropdown
    id: task_type
    attributes:
      label: Task Type（同步填写总盘字段）
      options: [Bug, 需求, 优化, 技术债, 监控, 研究]
    validations: {required: true}
  - type: dropdown
    id: risk
    attributes:
      label: Change Risk（同步填写总盘字段）
      options: [Low, Medium, High]
    validations: {required: true}
  - type: textarea
    id: problem
    attributes: {label: 问题或目标}
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 使用可验证的 checklist。
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: Medium 必填；Low 可留空。
  - type: textarea
    id: verification
    attributes:
      label: 验证与回退
      description: Medium 必填；说明验证方式和必要时的回退。
  - type: textarea
    id: high_risk
    attributes:
      label: 根因与风险
      description: High 必填。
  - type: textarea
    id: implementation
    attributes:
      label: 实施方案
      description: High 必填。
  - type: textarea
    id: rollout
    attributes:
      label: 上线与监控
      description: High 必填。
